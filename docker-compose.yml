services:
  db:
    image: postgres:15-alpine
    container_name: oldshop_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: oldshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oldshop_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oldshop_backend
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=123
      - DB_NAME=oldshop
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Cập nhật lại đường dẫn để dev trực tiếp
      - ./database:/database_src 
    networks:
      - oldshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oldshop_frontend
    depends_on:
      - backend
    ports:
      - "80:80" # Publish cổng 80 cho web
    networks:
      - oldshop_network

  prometheus:
    image: prom/prometheus:latest
    container_name: oldshop_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - oldshop_network

  grafana:
    image: grafana/grafana:latest
    container_name: oldshop_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - oldshop_network

networks:
  oldshop_network:
    driver: bridge

volumes:
  postgres_data:
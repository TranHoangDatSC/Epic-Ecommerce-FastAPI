name: Deploy

# Runs after CI succeeds on main (or manually): build images, push them to GHCR,
# then SSH into the VPS and run deploy/scripts/deploy.sh with the new tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to (re)deploy, e.g. a short SHA for a rollback. Empty = build current commit."
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.tag == '' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: vars
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/oldshop-backend:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/oldshop-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/oldshop-frontend:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/oldshop-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      # Images are already in GHCR at this point; without a server configured there is nothing to roll out.
      - name: Skip when no VPS is configured
        if: env.VPS_HOST == ''
        run: echo "::notice title=Deploy skipped::Images were pushed to GHCR. Set the VPS_HOST, VPS_USER and VPS_SSH_KEY secrets to deploy automatically."

      - name: Deploy over SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ inputs.tag || needs.build.outputs.tag }}
          REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TAG,REF
          script: |
            set -e
            cd /opt/oldshop
            git fetch --quiet origin
            git checkout --quiet "$REF"
            deploy/scripts/deploy.sh "$TAG"

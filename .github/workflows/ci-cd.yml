name: Oldshop E-commerce CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: oldshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Bắt buộc để SonarCloud đọc được lịch sử code

      # --- 1. CHẠY TEST BACKEND ---
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Dummy ML Models
        working-directory: ./backend
        run: |
          # 1. Tạo Model giả
          python -c "import joblib; from sklearn.ensemble import IsolationForest; m = IsolationForest(); m.fit([[0],[0]]); joblib.dump(m, 'app/core/fraud_model.joblib')"

          # 2. Tạo Scaler giả
          python -c "import joblib; from sklearn.preprocessing import StandardScaler; s = StandardScaler(); s.fit([[0],[0]]); joblib.dump(s, 'app/core/scaler.joblib')"

      - name: Init Database Schema & Seed Data
        env:
          PGPASSWORD: 123
        run: |
          # Dùng psql để chạy file all.sql đổ vào database oldshop_test
          psql -h localhost -U postgres -d oldshop_test -f database/all.sql

      - name: Run Backend Tests (Sinh coverage.xml)
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: 123
          DB_NAME: oldshop_test
          # Bơm thêm các biến môi trường bị thiếu (dùng giá trị giả cho test)
          DATABASE_URL: postgresql://postgres:123@localhost:5432/oldshop_test
          SMTP_USER: dummy_user
          SMTP_PASSWORD: dummy_password
          MAIL_USERNAME: dummy_user
          MAIL_PASSWORD: dummy_password
          SECRET_KEY: super_secret_key_for_testing_123
          PAYPAL_CLIENT_ID: dummy_client_id
          PAYPAL_SECRET: dummy_paypal_secret
        run: pytest

      # --- 2. CHẠY TEST FRONTEND ---
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test # Lệnh này giờ sẽ tự sinh ra frontend/coverage/.../lcov.info

      # --- 3. ĐẨY LÊN SONARCLOUD ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-deploy:
    # ... (Giữ nguyên như cũ của bạn) ...
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Build and Verify Docker Images
        run: docker-compose build
      - name: Simulate Deployment
        run: echo "Triển khai thành công lên môi trường ${{ github.ref_name }}"
